{% extends 'base.html' %}
{% block head %}
<!-- CSS 파일 연결 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/question_form.css') }}">
{% endblock %}

{% block content %}
<!-- 화면 중앙 배치를 위한 메인 컨테이너 -->
<div class="container common-container">

    <!-- 메인 제목 -->
    <h3 class="main-title">문의내용</h3>
    <hr/>

    <form method="post" enctype="multipart/form-data">

        {{ csrf_token() if csrf_token }}

        <!-- 👈👇 [1. 종류 선택 영역 수정 - 버튼 및 hidden input 제거] 👇👈 -->
        <div class="form-group d-flex align-items-center gap-5">
            <label class="form-label" style="width: 150px">
                종류 <span class="text-dark">*</span>
            </label>
            <div class="d-flex align-items-center gap-4">
                <!-- 라디오 버튼 1: 영화관문의 -->
                <label class="radio-label">
                    <input type="radio" name="kind" value="영화관문의" id="kind_theater"
                           {% if not question or question.kind == '영화관문의' %}checked{% endif %}>
                    <span>영화관문의</span>
                </label>

                <!-- 라디오 버튼 2: 기타 문의 -->
                <label class="radio-label">
                    <input type="radio" name="kind" value="기타 문의" id="kind_etc"
                           {% if question and question.kind == '기타 문의' %}checked{% endif %}>
                    <span>기타 문의</span>
                </label>
            </div>
        </div>
        <!-- 👈👆 [종류 선택 영역 수정 완료] 👆👈 -->
        <hr/>

        <!-- 2. 제목 입력 영역 -->
        <div class="form-group row">
            <label for="title" class="form-label col-lg-2">
                제목 <span>*</span>
            </label>

            <input

                type="text"
                id="title"
                name="title"
                class="form-input col-lg-10"
                placeholder="제목을 입력해주세요"
                value="{{ question.title if question else '' }}"
                maxlength="50"
                oninput="updateCharCount(this)"
                required
            >
            <div class="char-counter text-end">
                <span id="charCount">0</span>/한글 50자
            </div>
        </div>
        <hr/>

        <!-- 3. 내용 입력 영역 -->
        <div class="form-group row">
            <label for="content" class="form-label col-lg-2">
                내용 <span>*</span>
            </label>

            <textarea
                id="content"
                name="content"
                class="form-input col-lg-10"
                placeholder="내용 및 첨부파일에 개인정보(카드번호, 계좌번호, 주민번호)가 포함되지 않도록 유의하여 입력해주세요"
                maxlength="2000"
                oninput="updateCharCount(this)"
                required
            >{{ question.content if question else '' }}</textarea>
            <div class="char-counter text-end">
                <span id="contentCount">0</span>/한글 2,000자
            </div>
        </div>
        <hr/>

        <!-- 4. 첨부파일 영역 -->
        <div class="form-group">
            <label class="form-label col-lg-2">
                첨부파일
            </label>

            <input type="file" name="image" id="image">
        </div>
        <hr/>

        <div style="text-align: center;">
            <button type="button" class="cancel-button" style="width: 100px;" onclick="history.back()">취소</button>
            <button type="submit" class="common-button" style="width: 100px;">저장하기</button>
        </div>

    </form>

</div>
{% endblock %}

{% block script %}
<!-- 👈👇 [스크립트 수정 - 영화관선택 관련 함수 및 이벤트 전체 제거] 👇👈 -->
<script>
    function updateCharCount(input) {
        const count = input.value.length;
        if (input.id === 'title') {
            document.getElementById('charCount').textContent = count;
        } else if (input.id === 'content') {
            document.getElementById('contentCount').textContent = count;
        }
    }

    // 페이지 진입 시 글자 수 초기화
    document.addEventListener('DOMContentLoaded', function() {
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        if (titleInput) updateCharCount(titleInput);
        if (contentInput) updateCharCount(contentInput);
    });
</script>
<!-- 👈👆 [스크립트 수정 완료] 👆👈 -->
{% endblock %}
